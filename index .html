<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg1: #1b0a2e;
      --bg2: #4a1259;
      --rose: #ff5d8f;
      --gold: #ffd166;
      --cream: #fff6e5
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--cream);
      background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #7a1f5c);
      background-attachment: fixed;
      overflow-x: hidden
    }

    canvas#fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50
    }

    section {
      min-height: 100vh;
      padding: 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative
    }

    /* Hero */
    .hero h2 {
      font-weight: 300;
      letter-spacing: .2em;
      font-size: clamp(.9rem, 3vw, 1.3rem);
      color: var(--gold);
      opacity: 0;
      animation: fade 1s .3s forwards
    }

    .hero h1 {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: clamp(3.5rem, 15vw, 9rem);
      line-height: 1.1;
      margin: 10px 0;
      background: linear-gradient(90deg, var(--gold), var(--rose), var(--gold));
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite
    }

    .hero h1 span {
      display: inline-block;
      opacity: 0;
      transform: translateY(40px) scale(.6);
      animation: pop .7s forwards
    }

    .name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.5rem, 10vw, 5.5rem);
      color: var(--cream);
      opacity: 0;
      animation: fade 1.2s 1.8s forwards;
      text-shadow: 0 0 30px var(--rose)
    }

    .btn {
      margin-top: 36px;
      padding: 14px 34px;
      border: 0;
      border-radius: 50px;
      font: 600 1rem 'Poppins';
      color: #2b0a3d;
      background: linear-gradient(135deg, var(--gold), #ff9ec0);
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255, 93, 143, .45);
      transition: transform .25s;
      opacity: 0;
      animation: fade 1s 2.6s forwards
    }

    .btn:hover {
      transform: scale(1.08) rotate(-2deg)
    }

    .hint {
      position: absolute;
      bottom: 24px;
      font-size: .8rem;
      opacity: .6;
      animation: bob 2s infinite
    }

    /* Balloons */
    .balloons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1
    }

    .b {
      position: absolute;
      bottom: -160px;
      width: 60px;
      height: 76px;
      border-radius: 50% 50% 48% 48%;
      animation: rise linear infinite;
      opacity: .85
    }

    .b::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1px;
      height: 70px;
      background: rgba(255, 255, 255, .4)
    }

    /* Message card */
    h3.title {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: clamp(2.2rem, 8vw, 4rem);
      color: var(--gold);
      margin-bottom: 28px
    }

    .card {
      max-width: 640px;
      padding: 40px 32px;
      border-radius: 28px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 214, 102, .35);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
      line-height: 1.9;
      font-size: 1.05rem;
      min-height: 220px;
      text-align: left
    }

    .cursor {
      display: inline-block;
      width: 2px;
      background: var(--gold);
      margin-left: 2px;
      animation: blink 1s infinite
    }

    /* Cake */
    .cake {
      position: relative;
      width: 200px;
      margin: 20px auto 0
    }

    .layer {
      height: 50px;
      border-radius: 12px;
      margin: 0 auto
    }

    .l1 {
      width: 200px;
      background: linear-gradient(#ff8fb1, #ff5d8f)
    }

    .l2 {
      width: 150px;
      background: linear-gradient(#ffe3a3, #ffd166);
      margin-bottom: -2px
    }

    .l3 {
      width: 100px;
      background: linear-gradient(#fff, #ffd6e5)
    }

    .candle {
      width: 10px;
      height: 36px;
      background: repeating-linear-gradient(45deg, #fff, #fff 6px, var(--rose) 6px, var(--rose) 12px);
      margin: 0 auto;
      border-radius: 3px;
      position: relative
    }

    .flame {
      position: absolute;
      left: 50%;
      top: -24px;
      width: 14px;
      height: 22px;
      margin-left: -7px;
      border-radius: 50% 50% 50% 50%/60% 60% 40% 40%;
      background: radial-gradient(#fff, var(--gold) 60%, #ff7b00);
      box-shadow: 0 0 22px 8px rgba(255, 180, 0, .6);
      animation: flicker .15s infinite alternate;
      transition: opacity .4s
    }

    .cake.off .flame {
      opacity: 0
    }

    .cake-note {
      margin-top: 22px;
      font-size: .95rem;
      opacity: .8
    }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
      width: min(1000px, 100%)
    }

    .photo {
      aspect-ratio: 3/4;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      padding: 10px 10px 36px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .4);
      transform: rotate(var(--r));
      opacity: 0;
      translate: 0 50px;
      transition: opacity .8s, translate .8s, transform .35s;
      cursor: pointer
    }

    .photo.in {
      opacity: 1;
      translate: 0 0
    }

    .photo:hover {
      transform: rotate(0) scale(1.05);
      z-index: 3
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #eee
    }

    .lb {
      position: fixed;
      inset: 0;
      background: rgba(10, 0, 20, .92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px
    }

    .lb.open {
      display: flex
    }

    .lb img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 14px;
      animation: pop .4s
    }

    /* Video */
    .video-wrap {
      width: min(480px, 100%);
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: 0 0 60px rgba(255, 93, 143, .45)
    }

    video {
      width: 100%;
       max-height: 45vh;
      display: block;
      background: #000
    }

    footer {
      padding: 60px 20px;
      text-align: center;
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: var(--gold)
    }

    @keyframes fade {
      to {
        opacity: 1
      }
    }

    @keyframes pop {
      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes shine {
      to {
        background-position: 200%
      }
    }

    @keyframes bob {
      50% {
        transform: translateY(8px)
      }
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    @keyframes flicker {
      to {
        transform: scale(1.1, .92) rotate(3deg)
      }
    }

    @keyframes rise {
      to {
        transform: translateY(-125vh) rotate(8deg)
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01s !important;
        animation-iteration-count: 1 !important
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>
  <div class="balloons" id="balloons"></div>

  <section class="hero">
    <h2>🎉 TODAY IS SPECIAL 🎉</h2>
    <h1 id="hb"></h1>
    <div class="name" id="name"></div>
    <button class="btn" id="party">🎊 Surprise Kholo 🎊</button>
    <div class="hint">↓ neeche scroll karo ↓</div>
  </section>

  <section>
    <h3 class="title">Ek Pyaara Sa Message</h3>
    <div class="card"><span id="msg"></span><span class="cursor">&nbsp;</span></div>
  </section>

  <section>
    <h3 class="title">Mombatti Phook Do!</h3>
    <div class="cake" id="cake">
      <div class="candle">
        <div class="flame"></div>
      </div>
      <div class="layer l3"></div>
      <div class="layer l2"></div>
      <div class="layer l1"></div>
    </div>
    <p class="cake-note">Candle par tap karo aur wish maango 🕯️</p>
  </section>

  <section>
    <h3 class="title">Yaadon Ki Album</h3>
    <div class="gallery" id="gallery"></div>
  </section>

  <section>
    <h3 class="title">Ek Khaas Video</h3>
    <div class="video-wrap">
      <video id="vid" controls playsinline preload="metadata"></video>
    </div>
  </section>

  <footer id="foot"></footer>
  <div class="lb" id="lb"><img alt=""></div>

  <script>
    /* ============ ✏️ YAHAN APNI DETAILS BADLO ============ */
    const CONFIG = {
      name: "Ashish",                       // jiska birthday hai uska naam
      from: "Jigri Yarr",                // aapka naam
      message: "Janamdin mubarak ho! 🎂 Tumhari smile se hi hamari duniya roshan hai. Bhagwan kare tumhari har wish poori ho, har din khushiyon se bhara ho, aur tum hamesha yun hi hanste muskurate raho. Ye saal tumhare liye dher saari success, pyaar aur yaadein laye. Love you! ❤️",
      photos: [                            // photos folder me rakho, naam yahan likho
        "photos/1.jpeg",
        "photos/2.jpeg",
        "photos/3.jpeg",
        "photos/4.jpeg"
      ],
      video: "video/birthday.mp4"          // video folder me rakho
    };
    /* ===================================================== */

    /* Title letters */
    const hb = document.getElementById('hb');
    "Happy Birthday".split('').forEach((c, i) => { const s = document.createElement('span'); s.textContent = c === ' ' ? '\u00A0' : c; s.style.animationDelay = (.6 + i * .07) + 's'; hb.appendChild(s) });
    document.getElementById('name').textContent = CONFIG.name + " ✨";
    document.getElementById('foot').textContent = "With love, " + CONFIG.from + " ❤️";
    document.title = "Happy Birthday " + CONFIG.name + " 🎂";

    /* Balloons */
    const cols = ['#ff5d8f', '#ffd166', '#7bdff2', '#b388ff', '#80ed99', '#ff9e6d'];
    const bl = document.getElementById('balloons');
    for (let i = 0; i < 14; i++) { const b = document.createElement('div'); b.className = 'b'; b.style.left = Math.random() * 95 + '%'; b.style.background = `radial-gradient(circle at 30% 30%,#fff8,${cols[i % cols.length]} 60%)`; b.style.animationDuration = (9 + Math.random() * 10) + 's'; b.style.animationDelay = (-Math.random() * 15) + 's'; bl.appendChild(b) }

    /* Confetti */
    const cv = document.getElementById('fx'), cx = cv.getContext('2d'); let P = [];
    function size() { cv.width = innerWidth; cv.height = innerHeight } size(); addEventListener('resize', size);
    function burst(x, y, n = 140) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9; P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], l: 140 + Math.random() * 80 }) } }
    function rain() { for (let i = 0; i < 6; i++)P.push({ x: Math.random() * cv.width, y: -20, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, w: 7, h: 11, r: 0, vr: .15, c: cols[i % cols.length], l: 260 }) }
    (function loop() { cx.clearRect(0, 0, cv.width, cv.height); P = P.filter(p => p.l > 0); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .99; p.r += p.vr; p.l--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1, p.l / 40); cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore() }); requestAnimationFrame(loop) })();
    setTimeout(() => { burst(innerWidth * .25, innerHeight * .5); burst(innerWidth * .75, innerHeight * .5) }, 900);
    document.getElementById('party').onclick = e => { burst(e.clientX, e.clientY, 200); for (let i = 0; i < 5; i++)setTimeout(() => rain(), i * 300); document.querySelectorAll('section')[1].scrollIntoView({ behavior: 'smooth' }) };
    setInterval(() => { if (Math.random() < .5) rain() }, 900);

    /* Typing message (starts when visible) */
    const msgEl = document.getElementById('msg'); let typed = false;
    new IntersectionObserver((e, o) => { if (e[0].isIntersecting && !typed) { typed = true; let i = 0; (function t() { msgEl.textContent = CONFIG.message.slice(0, ++i); if (i < CONFIG.message.length) setTimeout(t, 35) })() } }, { threshold: .5 }).observe(msgEl);

    /* Cake */
    const cake = document.getElementById('cake');
    cake.onclick = e => { cake.classList.toggle('off'); if (cake.classList.contains('off')) { const r = cake.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 220) } };

    /* Gallery */
    const g = document.getElementById('gallery'), lb = document.getElementById('lb'), lbi = lb.querySelector('img');
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target) } }), { threshold: .2 });
    CONFIG.photos.forEach((src, i) => { const d = document.createElement('div'); d.className = 'photo'; d.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + i % 3)) + 'deg'); d.style.transitionDelay = (i % 4) * .12 + 's'; const im = new Image(); im.src = src; im.alt = "Photo " + (i + 1); im.loading = 'lazy'; im.onerror = () => { im.onerror = null; im.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#f3d9e6"/><text x="150" y="195" font-size="40" text-anchor="middle">📷</text><text x="150" y="235" font-size="14" text-anchor="middle" fill="#7a1f5c">' + src + '</text></svg>') }; d.appendChild(im); d.onclick = () => { lbi.src = im.src; lb.classList.add('open') }; g.appendChild(d); io.observe(d) });
    lb.onclick = () => lb.classList.remove('open');

    /* Video */
    document.getElementById('vid').src = CONFIG.video;
  </script>
</body>

</html>
